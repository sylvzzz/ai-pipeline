name: AI Code Review

on:
  pull_request:
    branches: [main, sylvzzz-dev]
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Get Pull Request diff
        run: |
          {
            echo "=== CHANGED FILES ==="
            git diff origin/${{ github.base_ref }}...HEAD --name-status
            echo ""
            echo "=== CHANGE SCALE ==="
            git diff origin/${{ github.base_ref }}...HEAD --stat
            echo ""
            echo "=== FULL DIFF ==="
            git diff origin/${{ github.base_ref }}...HEAD -- . \
              ':(exclude)package-lock.json' \
              ':(exclude)*.lock'
          } > diff.txt
          echo "Tamanho do diff:"
          wc -l diff.txt

      - name: Build repo context for review
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/build_context.py --selftest && python scripts/build_context.py

      - name: Run AI Review
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: python scripts/ai-review.py